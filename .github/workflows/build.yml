name: Compilar Espejo Rescate (.exe)

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip customtkinter pillow pyinstaller

      - name: Descargar scrcpy + adb en bin/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python descargar_binarios.py --plataforma windows

      - name: Compilar ejecutable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name EspejoRescate
          --add-data "bin;bin" --collect-data customtkinter main.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EspejoRescate-windows
          path: dist/EspejoRescate.exe
          if-no-files-found: error

      - name: Publicar Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Espejo Rescate ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/EspejoRescate.exe
